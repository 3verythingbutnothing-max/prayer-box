name: Check backend foundation

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: backend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run backend:types
      - name: Check generated bindings are current
        run: git diff --exit-code -- backend/worker-configuration.d.ts
      - run: npm run backend:check
      - run: npm run backend:test:check
      - run: npm run backend:policy
      - run: npm run backend:build
      - run: npm run backend:test
      - run: npm test
      - run: npm run test:stress
      - run: npm run build:pages
      - name: Validate the Worker bundle without deployment
        run: npm run backend:dry-run
